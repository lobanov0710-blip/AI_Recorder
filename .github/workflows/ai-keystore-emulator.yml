name: AI Recorder Keystore emulator instrumentation

on:
  push:
    branches:
      - feature/ai-agent-https-e2e-stage47
    paths:
      - "app/src/androidTest/java/com/nicko/airecorder/ai/DeviceCredentialStoreInstrumentedTest.java"
      - "app/src/main/java/com/nicko/airecorder/ai/DeviceCredentialStore.java"
      - ".github/workflows/ai-keystore-emulator.yml"
  pull_request:
    paths:
      - "app/src/androidTest/java/com/nicko/airecorder/ai/DeviceCredentialStoreInstrumentedTest.java"
      - "app/src/main/java/com/nicko/airecorder/ai/DeviceCredentialStore.java"
      - ".github/workflows/ai-keystore-emulator.yml"

permissions:
  contents: read

jobs:
  keystore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android compile SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run only isolated Keystore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nicko.airecorder.ai.DeviceCredentialStoreInstrumentedTest
