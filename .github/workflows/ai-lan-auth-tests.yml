name: AI Recorder LAN authentication tests

on:
  push:
    branches:
      - feature/ai-agent-lan-security-stage44
    paths:
      - "backend_security/**"
      - "tests/test_lan_auth.py"
      - ".github/workflows/ai-lan-auth-tests.yml"
  pull_request:
    paths:
      - "backend_security/**"
      - "tests/test_lan_auth.py"
      - ".github/workflows/ai-lan-auth-tests.yml"

permissions:
  contents: read

jobs:
  lan-auth-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install fastapi==0.128.2 httpx==0.28.1 pytest==9.0.2
      - name: Run FastAPI LAN guard unit tests
        run: python -m pytest -q tests/test_lan_auth.py
