name: AI Recorder LAN authentication tests

on:
  push:
    branches:
      - feature/ai-agent-lan-security-stage44
      - feature/ai-agent-device-pairing-stage45
      - feature/ai-agent-https-e2e-stage47
    paths:
      - "backend_security/**"
      - "tests/test_lan_auth.py"
      - "tests/test_device_registry.py"
      - "tests/test_stage47_tls_e2e.py"
      - ".github/workflows/ai-lan-auth-tests.yml"
  pull_request:
    paths:
      - "backend_security/**"
      - "tests/test_lan_auth.py"
      - "tests/test_device_registry.py"
      - "tests/test_stage47_tls_e2e.py"
      - ".github/workflows/ai-lan-auth-tests.yml"

permissions:
  contents: read

jobs:
  lan-auth-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install fastapi==0.128.2 httpx==0.28.1 pytest==9.0.2 "uvicorn>=0.34,<1" "cryptography>=44,<48"
      - name: Run FastAPI LAN guard unit tests
        run: python -m pytest -q tests/test_lan_auth.py tests/test_device_registry.py tests/test_stage47_tls_e2e.py
