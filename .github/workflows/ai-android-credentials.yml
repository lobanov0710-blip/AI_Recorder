name: AI Recorder Android credential checks

on:
  push:
    branches:
      - feature/ai-agent-android-keystore-stage46
    paths:
      - "app/src/main/java/com/nicko/airecorder/ai/**"
      - "app/src/test/java/com/nicko/airecorder/ai/**"
      - "app/src/androidTest/java/com/nicko/airecorder/ai/**"
      - ".github/workflows/ai-android-credentials.yml"
      - "app/build.gradle.kts"
  pull_request:
    paths:
      - "app/src/main/java/com/nicko/airecorder/ai/**"
      - "app/src/test/java/com/nicko/airecorder/ai/**"
      - "app/src/androidTest/java/com/nicko/airecorder/ai/**"
      - ".github/workflows/ai-android-credentials.yml"
      - "app/build.gradle.kts"

permissions:
  contents: read

jobs:
  android-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android 16 QPR2 compilation SDK
        run: |
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: JVM tests and instrumented-test compilation (no emulator)
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestJavaWithJavac
