name: AI Recorder Android credential checks

on:
  push:
    branches:
      - feature/ai-agent-android-keystore-stage46
      - feature/ai-agent-https-e2e-stage47
    paths:
      - "app/src/main/java/com/nicko/airecorder/ai/**"
      - "app/src/test/java/com/nicko/airecorder/ai/**"
      - "app/src/androidTest/java/com/nicko/airecorder/ai/**"
      - ".github/workflows/ai-android-credentials.yml"
      - "app/build.gradle.kts"
      - "docs/ai-server-https-e2e-stage47.md"
  pull_request:
    paths:
      - "app/src/main/java/com/nicko/airecorder/ai/**"
      - "app/src/test/java/com/nicko/airecorder/ai/**"
      - "app/src/androidTest/java/com/nicko/airecorder/ai/**"
      - ".github/workflows/ai-android-credentials.yml"
      - "app/build.gradle.kts"
      - "docs/ai-server-https-e2e-stage47.md"

permissions:
  contents: read

jobs:
  android-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android 16 QPR2 compilation SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.0.0"
      - name: JVM tests and instrumented-test compilation (no emulator)
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestJavaWithJavac
      - name: Create an ephemeral public CA file outside repository
        shell: bash
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/stage47-ci-private.key" \
            -out "$RUNNER_TEMP/stage47-ci-public-ca.pem" \
            -subj "/CN=CI Throwaway CA" -days 1 >/dev/null 2>&1
          test -s "$RUNNER_TEMP/stage47-ci-public-ca.pem"
      - name: Build isolated HTTPS debug configuration (no credential provisioning)
        shell: bash
        run: |
          bash gradlew --no-daemon :app:assembleDebug \
            -PaiServerScheme=https -PaiServerPort=18443 \
            "-PaiDebugCaPemFile=$RUNNER_TEMP/stage47-ci-public-ca.pem"
      - name: Remove CI throwaway private key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/stage47-ci-private.key" "$RUNNER_TEMP/stage47-ci-public-ca.pem"
